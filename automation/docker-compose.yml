services:

  hello-automation:
    image: crccheck/hello-world
    container_name: hello-automation
    networks:
      - proxy
    environment:
     - PORT=8000

  mosquitto:
    container_name: mqtt-broker
    image: eclipse-mosquitto:latest
    profiles: [ production ]
    network_mode: host
    restart: unless-stopped
    volumes:
      - ../data/mosquitto/config:/mosquitto/config
      - ../data/mosquitto/data:/mosquitto/data
      - ../data/mosquitto/log:/mosquitto/log
      - /etc/localtime:/etc/localtime:ro
    labels:
      - production
      - automation

  n8n:
    container_name: n8n
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    network_mode: host
    # networks:
    #   - proxy
    # ports:
    #   - "5678:5678"
    user: 1000:984
    environment:
      - GENERIC_TIMEZONE=Europe/Dublin
      - TZ=Europe/Dublin
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_MIGRATE_FS_STORAGE_PATH=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODES_EXCLUDE="[]"
      - DIR_PRINTER_PAPERLESS=/home/node/.n8n-files/printer/paperless
      - DIR_PRINTER_SYNOLOGY=/home/node/.n8n-files/printer/synology-inbox
      - DIR_PAPERLESS_CONSUME=/home/node/.n8n-files/paperless/consume
      - DIR_PAPERLESS_EXPORT=/home/node/.n8n-files/paperless/export
      - DIR_SYNOLOGY_INBOX=/home/node/.n8n-files/synology/inbox
      - DIR_SYNOLOGY_DOCS=/home/node/.n8n-files/synology/docs
      - DIR_TESTS=/home/node/.n8n-files/n8n/tests
    volumes:
      - ../data/n8n/data:/home/node/.n8n
      - /data/printer/paperless:/home/node/.n8n-files/printer/paperless:rw
      - /data/printer/synology:/home/node/.n8n-files/printer/synology-inbox:rw
      - /data/paperless/consume:/home/node/.n8n-files/paperless/consume:rw
      - /data/paperless/export:/home/node/.n8n-files/paperless/export:rw
      - /mnt/synology-nas/inbox/scans:/home/node/.n8n-files/synology/inbox:rw
      - /mnt/synology-nas/inbox/docs:/home/node/.n8n-files/synology/docs:rw
      - /data/n8n/tests:/home/node/.n8n-files/n8n/tests:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - production
      - automation

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt:latest
    profiles: [ production ]
    network_mode: host
    depends_on: [ mosquitto ]
    restart: unless-stopped
    # user: mosquitto:hass
    # group_add:
    #   - dialout
    # user: 1000:1000
    volumes:
      - ../data/zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    # ports:
    #   # Frontend port
    #   - 8080:8080
    environment:
      - TZ=Europe/Dublin
      - ZIGBEE2MQTT_CONFIG_PERMIT_JOIN=true
      - ZIGBEE2MQTT_CONFIG_MQTT_BASE_TOPIC=zigbee2mqtt
      - ZIGBEE2MQTT_CONFIG_MQTT_SERVER=mqtt://localhost:1883
      # - ZIGBEE2MQTT_CONFIG_MQTT_USER='!secret.yaml broker_user'
      # - ZIGBEE2MQTT_CONFIG_MQTT_PASSWORD='!secret.yaml broker_password'
      - ZIGBEE2MQTT_CONFIG_MQTT_REJECT_UNAUTHORIZED=true
      - ZIGBEE2MQTT_CONFIG_MQTT_KEEPALIVE=60
      - ZIGBEE2MQTT_CONFIG_MQTT_VERSION=5
      - ZIGBEE2MQTT_CONFIG_MQTT_INCLUDE_DEVICE_INFORMATION=true
      - ZIGBEE2MQTT_CONFIG_SERIAL_PORT=/dev/ttyUSB0
      - ZIGBEE2MQTT_CONFIG_FRONTEND_ENABLED=true
      - ZIGBEE2MQTT_CONFIG_FRONTEND_PORT=8080
      # - ZIGBEE2MQTT_CONFIG_FRONTEND_AUTH_TOKEN='!secret.yaml frontend_auth_token'
      - ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_ENABLED=true
      - ZIGBEE2MQTT_CONFIG_HOMEASSISTANT_DISCOVERY_TOPIC=homeassistant
    devices:
      - /dev/serial/by-id/usb-Silicon_Labs_Sonoff_Zigbee_3.0_USB_Dongle_Plus_0001-if00-port0:/dev/ttyUSB0
    labels:
      - production
      - automation

  govee2mqtt:
    container_name: govee2mqtt
    image: ghcr.io/wez/govee2mqtt:latest
    profiles: [ production ]
    network_mode: host  # host networking is required
    depends_on: [ mosquitto ]
    restart: unless-stopped
    volumes:
      - ../data/govee2mqtt/data:/app/data
    #   - /run/udev:/run/udev:ro
    env_file:
      - ../data/govee2mqtt/config/.env
    # ports:
    #   - 8056:8056
    environment:
      - TZ=Europe/Dublin
      - GOVEE_MQTT_HOST=localhost
      - GOVEE_MQTT_PORT=1883
      - GOVEE_TEMPERATURE_SCALE=C # C for Celsius or F for Fahrenheit
      - RUST_LOG_STYLE=always # Always use colorized output
      # - RUST_LOG=govee=trace # Enable for debug mode
    labels:
      - production
      - automation

  home-assistant:
    container_name: home-assistant
    image: "ghcr.io/home-assistant/home-assistant:2026.10.4"
#    image: "ghcr.io/home-assistant/home-assistant:stable" 
    profiles: [ production ]
    network_mode: host
    restart: unless-stopped
    privileged: true
    volumes:
      - ../data/hass:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
      - /mnt/synology-nas:/media
    environment:
      - TZ=Europe/Dublin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # devices:
    #   - /dev/serial/by-id/usb-Nabu_Casa_Home_Assistant_Connect_ZBT-1_82d56869a0dced11bac7e62d62c613ac-if00-port0:/dev/ttyUSB0
    labels:
      - production
      - automation

  zone-configurator:
    image: everythingsmarthome/everything-presence-mmwave-configurator:latest
    container_name: zone-configurator
    restart: unless-stopped
    network_mode: host
    # ports:
    #   - "3002:3000"
    env_file: ./zone-configurator.env
    environment:
      PORT: 3002
      HA_BASE_URL: http://localhost:8123
    volumes:
      - ../data/zone-configurator/config:/config

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    environment:
      APP_URL: http://localhost:8090
    ports:
      - 8090:8090
    volumes:
      - ../beszel/data:/beszel_data
      - ../beszel/socket:/beszel_socket

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - ../beszel/agent_data:/var/lib/beszel-agent
      - ../beszel/socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # monitor other disks / partitions by mounting a folder in /extra-filesystems
      # - /mnt/disk/.beszel:/extra-filesystems/sda1:ro
    env_file: ./beszel-agent.env
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090


  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    profiles: [ production ]
    network_mode: host
    # ports:
    #   - 3000:3000
    volumes:
      - ../data/homepage/config:/app/config
      - ../data/homepage/resources:/app/public/resources
      # - /var/run/docker.sock:/var/run/docker.sock # (optional) For docker integrations
    environment:
      HOMEPAGE_ALLOWED_HOSTS: 192.168.5.2,home.automation.etauker.com,homepage.automation.etauker.com
      # PORT: 80
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - production
      - automation

  wyoming-piper:
    container_name: wyoming-piper
    image: rhasspy/wyoming-piper
    profiles: [ experimental ]
    ports:
      - "10200:10200"
    volumes:
      - "../data/piper:/data"
    command: [ "--voice", "en-gb-southern_english_female-low" ]
    restart: unless-stopped
    # networks:
    #   - home-automation
    labels:
      - experimental
      - automation

  wyoming-whisper:
    container_name: wyoming-whisper
    image: rhasspy/wyoming-whisper
    profiles: [ experimental ]
    ports:
      - "10300:10300"
    volumes:
      - ../data/whisper:/data
    command: [ "--model", "small-int8", "--language", "en" ]
    restart: unless-stopped
    # networks:
    #   - home-automation
    labels:
      - experimental
      - automation

  wyoming-speech-to-phrase:
    container_name: wyoming-speech-to-phrase
    image: rhasspy/wyoming-speech-to-phrase
    profiles: [ experimental ]
    # ports:
    #   - "10500:10500"
    volumes:
      - ../data/speech-to-phrase/models:/models
      - ../data/speech-to-phrase/train:/train
      - ../data/custom_sentences:/custom_sentences
    network_mode: host
    # command: [ "--model", "small-int8", "--language", "en" ]
    # volumes:
    #   - /path/to/download/models:/models
    #   - /path/to/train:/train
    command:
      - --uri
      - tcp://0.0.0.0:10500
      - --hass-websocket-uri
      - ws://192.168.5.2:8123/api/websocket
      - --hass-token
      - ${WYOMING_HASS_TOKEN}
      - --custom-sentences-dir
      - /custom_sentences
      - --retrain-on-start

      # --phrases-dir /data/phrases/phrases.yaml
