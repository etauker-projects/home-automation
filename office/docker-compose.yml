  # Paperless

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.0.5
    container_name: paperless
    restart: unless-stopped
    depends_on:
      - paperless-postgress
      - paperless-redis
    networks:
      - paperless
      - proxy
    ports:
      - "9001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - paperless.env
    volumes:
      - ../data/office/paperless/data:/usr/src/paperless/data
      - ../data/office/paperless/media:/usr/src/paperless/media
      - /data/paperless/export:/usr/src/paperless/export
      - /data/paperless/consume:/usr/src/paperless/consume

    # Reference: http://docs.paperless-ngx.com/configuration
    environment:
      # Database and Redis configuration
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: paperless-postgress
      # File permissions for consumption directory
      # USERMAP_UID: 1000
      # USERMAP_GID: 1000
      user: 1000:984
      # Proxy config
      PAPERLESS_URL: https://paperless.office.etauker.com
      PAPERLESS_ALLOWED_HOSTS: paperless.office.etauker.com
      PAPERLESS_CSRF_TRUSTED_ORIGINS: https://paperless.office.etauker.com
      # PAPERLESS_TRUSTED_PROXIES=
      PAPERLESS_USE_X_FORWARD_HOST: true
      PAPERLESS_USE_X_FORWARD_PORT: true
      PAPERLESS_USE_X_FORWARD_PROTO: true
      # Time, language and locale
      PAPERLESS_TIME_ZONE: Europe/Dublin
      PAPERLESS_OCR_LANGUAGE: eng
      # PAPERLESS_OCR_LANGUAGES=tur ces   # Additional languages to install for OCR

  paperless-redis:
    image: docker.io/library/redis:8
    container_name: paperless-redis
    restart: unless-stopped
    volumes:
      - ../data/office/redis:/data
    networks:
      - paperless
    # environment:
    #   UID: 1000
    #   GID: 1000

  paperless-postgress:
    image: docker.io/library/postgres:18
    container_name: paperless-postgress
    restart: unless-stopped
    volumes:
      - ../data/office/postgresql/pgdata:/var/lib/postgresql
    networks:
      - paperless
    env_file: paperless-postgress.env

  excalidraw:
    image: excalidraw/excalidraw:latest
    container_name: excalidraw
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - "9002:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  homebox:
    image: ghcr.io/sysadminsmedia/homebox:latest-hardened
    container_name: homebox
    restart: unless-stopped
    networks:
      - proxy
      - authentik
      - postgres
    environment:
      - HBOX_LOG_LEVEL=info
      - HBOX_LOG_FORMAT=text
      - HBOX_WEB_MAX_UPLOAD_SIZE=10
      - HBOX_OPTIONS_ALLOW_ANALYTICS=false
      - HBOX_MODE=production
      - HBOX_OPTIONS_ALLOW_LOCAL_LOGIN=true
      - HBOX_OPTIONS_TRUST_PROXY=true
      - HBOX_OPTIONS_ALLOW_REGISTRATION=false

      - HBOX_DATABASE_DRIVER=postgres
      - HBOX_DATABASE_HOST=office-postgres
      - HBOX_DATABASE_PORT=5432
      - HBOX_DATABASE_SSL_MODE=disable

      - HBOX_OIDC_ENABLED=true
      - HBOX_OIDC_ISSUER_URL=https://auth.security.etauker.com/application/o/homebox/
      - HBOX_OIDC_SCOPE=openid profile email
      - HBOX_OIDC_AUTO_REDIRECT=false
      # - HBOX_OIDC_VERIFY_EMAIL=false #	require email verification from OIDC provider
      # - HBOX_OIDC_GROUP_CLAIM=groups #	name of the claim in the ID token that contains user groups
      # - HBOX_OIDC_EMAIL_CLAIM=email #	name of the claim in the ID token that contains user email
      # - HBOX_OIDC_NAME_CLAIM=name #	name of the claim in the ID token that contains user display name
      # - HBOX_OIDC_EMAIL_VERIFIED_CLAIM=email_verified #	name of the claim in the ID token that contains user email verification status
      # - HBOX_OIDC_BUTTON_TEXT=Sign # in with OIDC	text displayed on the OIDC login button
      # - HBOX_OIDC_STATE_EXPIRY=10m #	how long OIDC state parameters are valid (for CSRF protection)
      # - HBOX_OIDC_REQUEST_TIMEOUT=30 #s

      # - HBOX_OTEL_ENABLED=false #	enable OpenTelemetry tracing. Standard OTEL_* env vars are also honored by the SDK in addition to these HBOX_OTEL_* options.
      # - HBOX_OTEL_SERVICE_NAME=homebox #	service name reported to the telemetry backend
      # - HBOX_OTEL_SERVICE_VERSION=service # version reported to the telemetry backend (defaults to the build version when unset)
      # - HBOX_OTEL_EXPORTER=otlp #	exporter type: otlp, stdout, or none
      # - HBOX_OTEL_ENDPOINT=OTLP # exporter endpoint including host and port, e.g. localhost:4317 for gRPC or http://localhost:4318 for HTTP
      # - HBOX_OTEL_PATH_PREFIX=optional # URL path prefix appended to the OTLP HTTP exporter endpoint
      # - HBOX_OTEL_PROTOCOL=grpc #	OTLP protocol: grpc or http
      # - HBOX_OTEL_INSECURE=false #	disable TLS for the OTLP exporter connection
      # - HBOX_OTEL_HEADERS=additional # headers to send with OTLP requests as comma-separated key=value pairs (e.g. an auth header for a managed backend; treated as a secret and redacted from debug output)
      # - HBOX_OTEL_SAMPLE_RATE=1 #.0	trace sampling rate from 0.0 (no traces) to 1.0 (all traces)
      # - HBOX_OTEL_ENABLE_METRICS=true #	enable OpenTelemetry metrics collection
      # - HBOX_OTEL_METRICS_INTERVAL=15s #	interval at which metrics are exported (e.g. 15s, 1m)
      # - HBOX_OTEL_ENABLE_LOGGING=true #	bridge zerolog into the OpenTelemetry logs pipeline
      # - HBOX_OTEL_ENABLE_DATABASE_TRACING=true #	emit spans for database operations
      # - HBOX_OTEL_ENABLE_HTTP_TRACING=true #	emit spans for HTTP requests
      # - HBOX_OTEL_PROXY_ENABLED=true #

    env_file:
      - homebox.env
      - homebox-postgres.env
    volumes:
      - homebox-data:/data/
    ports:
      - 9004:7745
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      office-postgres:
        condition: service_healthy

  sure:
    image: ghcr.io/we-promise/sure:stable
    container_name: sure
    restart: unless-stopped
    ports:
      - "9005:3000"
    volumes:
      - ../data/office/sure/storage:/rails/storage
    env_file:
      - sure.env
      - sure-postgres.env
    environment:
      DB_HOST: office-postgres
      DB_PORT: 5432
      SELF_HOSTED: "true"
      RAILS_FORCE_SSL: "false"
      RAILS_ASSUME_SSL: "true"
      WEBAUTHN_RP_ID: "etauker.com"
      WEBAUTHN_ALLOWED_ORIGINS: "https://sure.office.etauker.com"
      REDIS_URL: redis://sure-redis:6379/1
      APP_DOMAIN: "sure.office.etauker.com"
      OIDC_ISSUER: "https://auth.security.etauker.com/application/o/sure/"
      OIDC_REDIRECT_URI: "https://sure.office.etauker.com/auth/openid_connect/callback"
      OIDC_ALLOW_SIGNUP: "true"

    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - postgres
      - sure
      # - authentik
      - proxy
    depends_on:
      office-postgres:
        condition: service_healthy
      sure-redis:
        condition: service_healthy

  worker:
    image: ghcr.io/we-promise/sure:stable
    container_name: sure-worker
    restart: unless-stopped
    command: bundle exec sidekiq
    volumes:
      - ../data/office/sure/storage:/rails/storage
    env_file:
      - sure.env
      - sure-postgres.env
    environment:
      DB_HOST: office-postgres
      DB_PORT: 5432
      SELF_HOSTED: "true"
      REDIS_URL: redis://sure-redis:6379/1
    networks:
      - postgres
      - sure
    depends_on:
      office-postgres:
        condition: service_healthy
      sure-redis:
        condition: service_healthy

  sure-redis:
    image: redis:latest
    container_name: sure-redis
    restart: unless-stopped
    volumes:
      - sure-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sure

networks:
  postgres:
    name: postgres
    external: false
  paperless:
    name: paperless
    external: false
  sure:
    name: sure
    external: false
  proxy:
    name: proxy
    external: true
  authentik:
    name: authentik
    external: true

volumes:
  homebox-data:
    driver: local
  # sure-app-data:
  #   driver: local
  sure-redis-data:
    driver: local