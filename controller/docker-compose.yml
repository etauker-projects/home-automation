services:
  # Development Service
  controller-dev:
    build:
      context: .
      dockerfile: dev.dockerfile
    container_name: home-automation-controller-dev
    profiles:
      - development
      - dev
    restart: unless-stopped
    ports:
      - "${PORT:-8875}:${PORT:-8875}"
      - "9229:9229"  # Debug port
    env_file:
      - ${CONTROLLER_ENV_FILE:-.env}
    environment:
      - NODE_ENV=development
    volumes:
      # Mount source code for hot-reload
      - ./src:/app/src:ro
      # Use named volume for node_modules to avoid conflicts
      - node_modules_dev:/app/node_modules
      # If you need to persist data
      - ${DIR_PRINTER_PAPERLESS:-./data/scans}:/app/data/scans
      - ${DIR_PAPERLESS_CONSUME:-./data/paperless-consume}:/app/data/paperless-consume
      - ${DIR_PAPERLESS_EXPORT:-./data/paperless-exports}:/app/data/paperless-exports
      - ${DIR_SYNOLOGY_DOCS:-./data/nas}:/app/data/nas
      - ${DIR_CONFIG:-./data/config}:/app/data/config
      # Power monitoring directories
      - ${DIR_POWER_MONITORING_INBOX:-./data/power-monitoring/inbox}:/app/data/power-monitoring/inbox
      - ${DIR_POWER_MONITORING_PROCESSED:-./data/power-monitoring/processed}:/app/data/power-monitoring/processed
      - ${DIR_POWER_MONITORING_METADATA:-./data/power-monitoring/metadata}:/app/data/power-monitoring/metadata
    networks:
      - controller-network
    user: "${UID:-1000}:${GID:-1000}"
    labels:
      - "app=home-automation-controller"
      - "environment=development"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Production Service
  controller-prod:
    build:
      context: .
      dockerfile: prod.dockerfile
    container_name: home-automation-controller-prod
    profiles:
      - production
      - prod
    restart: unless-stopped
    ports:
      - "${PORT:-8875}:${PORT:-8875}"
    env_file:
      - ${CONTROLLER_ENV_FILE:-.env}
    environment:
      - NODE_ENV=production
    volumes:
      # Mount only necessary directories for production
      # Adjust these based on your application needs
      - ${DIR_PRINTER_PAPERLESS:-./data/scans}:/app/data/scans
      - ${DIR_PAPERLESS_CONSUME:-./data/paperless-consume}:/app/data/paperless-consume
      - ${DIR_PAPERLESS_EXPORT:-./data/paperless-exports}:/app/data/paperless-exports
      - ${DIR_SYNOLOGY_DOCS:-./data/nas}:/app/data/nas
      - ${DIR_CONFIG:-./data/config}:/app/data/config
      # Power monitoring directories
      - ${DIR_POWER_MONITORING_INBOX:-./data/power-monitoring/inbox}:/app/data/power-monitoring/inbox
      - ${DIR_POWER_MONITORING_PROCESSED:-./data/power-monitoring/processed}:/app/data/power-monitoring/processed
      - ${DIR_POWER_MONITORING_METADATA:-./data/power-monitoring/metadata}:/app/data/power-monitoring/metadata
    networks:
      - controller-network
    user: "${UID:-1000}:${GID:-1000}"
    labels:
      - "app=home-automation-controller"
      - "environment=production"
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  controller-network:
    name: controller-network
    driver: bridge

volumes:
  node_modules_dev:
    name: controller-node-modules-dev
